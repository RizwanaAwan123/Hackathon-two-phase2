<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoX Chatbot - Professional Todo Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .bot-message {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .input-container {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }
        
        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .input-container input:focus {
            border-color: #007bff;
        }
        
        .input-container button {
            margin-left: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .input-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .input-container button:active {
            transform: translateY(0);
        }
        
        .examples {
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            font-size: 0.75rem;
            color: #6c757d;
            text-align: center;
            padding: 10px 0;
        }
        
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: white;
            color: #333;
            padding: 12px 16px;
            border-radius: 18px;
            border: 1px solid #e9ecef;
            font-style: italic;
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }
            
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 TodoX Chatbot</h1>
            <p>Professional Todo Management Assistant</p>
        </div>
        
        <div id="chat-container" class="chat-container">
            <div class="message bot-message">
                Hello! I'm your TodoX Chatbot. I can help you manage your tasks. Type 'help' to see all available commands!
            </div>
        </div>
        
        <div class="typing-indicator" id="typing-indicator">
            💬 Bot is typing...
        </div>
        
        <div class="examples">
            Commands: add [task], show todos, complete [num], delete [num], help
        </div>
        
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type your command..." autocomplete="off" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Add a message to the chat container with markdown support
        function addMessage(text, isUser) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            // Process markdown-like formatting
            let processedText = text;
            
            // Convert **bold** to <strong>
            processedText = processedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Convert line breaks
            processedText = processedText.replace(/\n/g, '<br>');
            
            messageDiv.innerHTML = processedText;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Show/hide typing indicator
        function showTypingIndicator(show) {
            const indicator = document.getElementById('typing-indicator');
            indicator.style.display = show ? 'block' : 'none';
            if (show) {
                document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
            }
        }

        // Send message to backend API
        async function sendMessage() {
            const userInput = document.getElementById('user-input');
            const message = userInput.value.trim();

            if (!message) return;

            // Display user message
            addMessage(message, true);
            userInput.value = '';

            // Show typing indicator
            showTypingIndicator(true);

            try {
                // Call backend API
                const response = await fetch('http://localhost:8002/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                
                // Hide typing indicator
                showTypingIndicator(false);
                
                // Add bot response
                addMessage(data.message, false);
                
                // Optionally update the UI with the current todo list
                if (data.todos && data.intent !== 'LIST') {
                    // Don't duplicate list messages if it was a LIST intent
                    if (data.intent !== 'LIST' && data.intent !== 'ADD' && data.intent !== 'DELETE' && data.intent !== 'COMPLETE') {
                        // Just show the response message
                    }
                }
            } catch (error) {
                // Hide typing indicator
                showTypingIndicator(false);
                
                addMessage('Sorry, I couldn\'t process your request. Please try again.', false);
                console.error('Error:', error);
            }
        }

        // Handle Enter key press
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focus input field on load
        window.onload = function() {
            document.getElementById('user-input').focus();
        };
    </script>
</body>
</html>
